<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Mimori · preview</title><link rel="stylesheet" href="/shared/typography.css?v=2"><link rel="stylesheet" href="/mimorigasaka/style.css"><link rel="stylesheet" href="/mimori/preview.css?v=account-devices-2"><script type="module" src="/mimori/app.bundle.js?v=account-devices-1"></script></head>
<body><a class="skip" href="#viewer">Skip to posts</a><div class="cables" aria-hidden="true"><i></i><i></i><i></i><i></i></div><main class="scene">
<header class="page-header"><a href="/">✧ COPLAND OS ✧ rev.2.6</a><button id="identity-toggle" aria-controls="identity" aria-expanded="true">login</button></header>
<p id="page-status" class="status" role="status">Mimori · experimental preview</p>
<div class="layout"><aside id="identity" class="identity"><div class="titlebar"><h1 id="identity-title">LAYER:00 IDENTITY</h1></div>
<form id="login-form" class="identity-form"><label for="username">Username</label><input id="username" autocomplete="username" required><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required minlength="12"><div class="form-actions"><button>Sign in</button></div></form>
<div id="profile" hidden><div class="profile-head"><img id="profile-picture" src="/shared/morisoba-lily.svg" width="56" height="56" alt=""><span id="profile-handle"></span></div>
<div class="profile-info"><p id="profile-bio"></p><button id="edit-profile" class="quiet">Edit profile</button></div><form id="profile-form" class="settings" hidden><label for="name">Name</label><input id="name" maxlength="80" required><label for="bio">Bio</label><textarea id="bio" maxlength="500" rows="3"></textarea><button>Save profile</button></form>
<section class="composer"><h2>New post</h2><form id="post-form"><label class="sr-only" for="draft">Post</label><textarea id="draft" rows="4" maxlength="10000" required></textarea><div class="form-actions"><button>Post</button></div></form></section>
<details class="tools"><summary>Keyring</summary><div class="settings"><p id="fingerprint" class="hint"></p><button id="copy-address">Copy identity link</button><form id="partner-form"><label for="partner-link">Partner’s identity link</label><input id="partner-link" type="url" required><button>Request</button></form><p id="partner-result" class="hint"></p><div id="partners"></div><label class="history-choice"><input id="share-history" type="checkbox"> Share older posts</label><p class="hint">Applies only when you choose Share beside a partner.</p></div></details>
</div>
<details id="account" class="tools" hidden><summary>Account</summary><div class="settings account-settings">
<p id="account-name" class="hint"></p>
<div id="account-admin" hidden><div class="tool-row"><button id="invite-people" type="button">Invite people</button><a href="/mimorigasaka/#admin-tools">Members</a></div><div id="account-invite" hidden><label for="account-invite-link">Private invitation</label><input id="account-invite-link" readonly><button id="copy-account-invite" type="button">Copy link</button></div></div>
<details class="password-settings"><summary>Change password</summary><form id="password-form"><label for="current-password">Current password</label><input id="current-password" type="password" autocomplete="current-password" required><label for="new-password">New password</label><input id="new-password" type="password" autocomplete="new-password" minlength="12" required><button>Save password</button></form></details>
<div class="tool-row"><a href="/mimorigasaka/">Original feed</a><button id="sign-out" class="quiet" type="button">Sign out</button></div>
</div></details></aside>
<section id="viewer" class="viewer"><div class="titlebar"><h2>LAYER:21 MIMORI</h2><button id="refresh" aria-label="Refresh posts">↻</button></div><div class="feed-wrap"><div id="feed-lock">Sign in to read posts.</div><div id="feed"></div></div></section></div></main></body></html>
