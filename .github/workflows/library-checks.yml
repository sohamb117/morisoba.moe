name: Library checks
on:
  pull_request:
    paths: ['library/**', 'shared/**', '**/index.html', 'index.html', 'data/**', 'scripts/**', 'tests/**', '.github/workflows/library-checks.yml']
  push:
    branches: [main]
    paths: ['library/**', 'shared/**', '**/index.html', 'index.html', 'data/**', 'scripts/**', 'tests/**']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r scripts/requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/*.test.cjs
      - run: node --check library/library.js
      - run: node --check shared/chrome.js && node --check shared/panel-effects.js
