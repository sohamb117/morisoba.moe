name: Mimorigasaka checks
on:
  pull_request:
    paths: ['mimorigasaka/**', 'mimori/**', 'protocol/**', 'scripts/build-protocol.mjs', 'middleware/**', 'migrations/**', 'worker.mjs', 'wrangler.jsonc', 'package*.json', '.assetsignore', 'tests/**', 'scripts/mimori-*.mjs', '.github/workflows/mimorigasaka-checks.yml']
  push:
    branches: [main]
    paths: ['mimorigasaka/**', 'mimori/**', 'protocol/**', 'scripts/build-protocol.mjs', 'middleware/**', 'migrations/**', 'worker.mjs', 'wrangler.jsonc', 'package*.json', '.assetsignore', 'tests/**', 'scripts/mimori-*.mjs', '.github/workflows/mimorigasaka-checks.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run deploy:check
