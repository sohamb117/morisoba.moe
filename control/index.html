<!doctype html><html lang="en" class="entry-pending"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Control / morisoba</title><link rel="icon" href="/shared/morisoba-lily.svg"><link rel="stylesheet" href="/shared/chrome.css"><link rel="stylesheet" href="/shared/hud.css"><link rel="stylesheet" href="/shared/typography.css"><link rel="stylesheet" href="/control/style.css"><script defer src="/shared/entry-screen.js"></script><script defer src="/shared/chrome.js"></script><script type="module" src="/control/app.bundle.js"></script></head><body>
<svg id="traces" aria-hidden="true"></svg><div id="decor" aria-hidden="true"></div><svg id="wires" aria-hidden="true"></svg><div id="scanlines" aria-hidden="true"></div><div id="grain" aria-hidden="true"></div>
<section id="entry-gate" role="dialog" aria-modal="true" aria-label="Admin sign in"><div class="entry-noise"></div><div class="entry-shell"><div class="entry-main"><div class="entry-sigil-wrap"><img class="entry-sigil" src="/shared/morisoba-lily.svg" width="420" height="420" alt=""></div><div class="entry-product">Copland OS Enterprise</div><div class="entry-maker">Product By Vesperglass Institute</div><div class="entry-rule"></div><form id="login-form"><label>User<input name="user" autocomplete="username" required spellcheck="false" autocapitalize="none"></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><div class="entry-actions"><button type="submit" id="sign-in">Admin</button></div><p id="auth-error" role="alert"></p></form></div></div></section>
<main id="stage" hidden aria-label="Control desktop"><section class="panel mat-paper" id="p-name" data-w="260" style="--tilt:rotate(-0.4deg)"><div class="titlebar"><span class="tl">Account</span><button class="pbtn" data-act="min" aria-label="Minimize Account">−</button><button class="pbtn" data-act="close" aria-label="Close Account">×</button></div><div class="pbody"><a class="site-name" href="/">morisoba.moe</a><p id="owner-email"></p><form id="profile-form"><label>Name<input name="displayName" maxlength="48" required></label><label>Bio<textarea name="bio" maxlength="280" rows="2"></textarea></label><button>Save</button></form><div class="actions"><button id="arrange">Arrange</button><button id="sign-out">Sign out</button></div><p id="profile-status" role="status"></p></div></section><section class="panel mat-paper" id="p-note" data-w="270" style="--tilt:rotate(0.5deg)"><div class="titlebar"><span class="tl">Booking pages</span><button class="pbtn" data-act="min" aria-label="Minimize Booking pages">−</button><button class="pbtn" data-act="close" aria-label="Close Booking pages">×</button></div><div class="pbody"><button id="new">New page</button><span id="count"></span><div id="list"></div><p id="status" role="status"></p></div></section><section class="panel mat-metal" id="p-ascii" data-w="320" style="--tilt:rotate(-0.3deg)"><div class="titlebar"><span class="tl">Invitations</span><button class="pbtn" data-act="min" aria-label="Minimize Invitations">−</button><button class="pbtn" data-act="close" aria-label="Close Invitations">×</button></div><div class="pbody"><button id="create-invite">Create invitation</button><div id="new-invite" hidden><input id="invite-link" aria-label="Invitation link" readonly><button id="copy-invite">Copy</button></div><div id="invites"></div><p id="invite-status" role="status"></p></div></section><section class="panel mat-crt scr-green" id="p-oracle" data-w="190" style="--tilt:rotate(0.6deg)"><div class="titlebar"><span class="tl">Calendar</span><button class="pbtn" data-act="min" aria-label="Minimize Calendar">−</button><button class="pbtn" data-act="close" aria-label="Close Calendar">×</button></div><div class="pbody"><p id="connection" role="status"></p><button id="check-connection">Refresh</button></div></section><section class="panel mat-paper" id="p-about" data-w="280" style="--tilt:rotate(-0.6deg)"><div class="titlebar"><span class="tl">Bookings</span><button class="pbtn" data-act="min" aria-label="Minimize Bookings">−</button><button class="pbtn" data-act="close" aria-label="Close Bookings">×</button></div><div class="pbody"><button id="refresh-bookings">Refresh</button><div id="bookings"></div></div></section><section class="panel mat-paper" id="p-works" data-w="330" style="--tilt:rotate(0.3deg)"><div class="titlebar"><span class="tl">Members</span><button class="pbtn" data-act="min" aria-label="Minimize Members">−</button><button class="pbtn" data-act="close" aria-label="Close Members">×</button></div><div class="pbody"><button id="refresh-members">Refresh</button><div id="members"></div><p id="member-status" role="status"></p></div></section><section class="panel mat-metal" id="p-contact" data-w="340" style="--tilt:rotate(-0.5deg)"><div class="titlebar"><span class="tl">Moderation</span><button class="pbtn" data-act="min" aria-label="Minimize Moderation">−</button><button class="pbtn" data-act="close" aria-label="Close Moderation">×</button></div><div class="pbody"><div id="posts"></div><button id="more-posts" hidden>More</button><p id="post-status" role="status"></p></div></section><section class="panel mat-paper" id="p-vessel" data-w="480" style="--tilt:rotate(0deg)"><div class="titlebar"><span class="tl">Edit booking page</span><button class="pbtn" data-act="min" aria-label="Minimize Edit booking page">−</button><button class="pbtn" data-act="close" aria-label="Close Edit booking page">×</button></div><div class="pbody"><h2 id="editor-title">New page</h2><form id="page-form">
<label>Title<input name="title" required maxlength="100"></label>
<label>Booking name<input name="slug" required maxlength="64" pattern="[a-z0-9][a-z0-9_\-]{0,63}"></label><p class="url" id="url">calendar.morisoba.moe/intro</p>
<label>Description<textarea name="description" maxlength="500" rows="2"></textarea></label>
<div class="pair"><label>Duration<select name="duration"><option value="15">15 minutes</option><option value="30" selected>30 minutes</option><option value="45">45 minutes</option><option value="60">1 hour</option><option value="90">90 minutes</option><option value="120">2 hours</option></select></label><label>Timezone<select name="timezone" id="zones"></select></label></div>
<label>Location<input name="location" maxlength="200"></label>
<fieldset><legend>Available days</legend><div class="weekdays"><label><input type="checkbox" name="day" value="1" checked>Mon</label><label><input type="checkbox" name="day" value="2" checked>Tue</label><label><input type="checkbox" name="day" value="3" checked>Wed</label><label><input type="checkbox" name="day" value="4" checked>Thu</label><label><input type="checkbox" name="day" value="5" checked>Fri</label><label><input type="checkbox" name="day" value="6">Sat</label><label><input type="checkbox" name="day" value="0">Sun</label></div></fieldset>
<div class="pair"><label>From<input type="time" name="start" value="13:00" step="900" required></label><label>Until<input type="time" name="end" value="17:00" step="900" required></label></div>
<div class="pair"><label>Minimum notice (hours)<input type="number" name="noticeHours" min="1" max="168" value="24" required></label><label>Booking window (days)<input type="number" name="horizonDays" min="1" max="90" value="30" required></label></div>
<div class="pair"><label>Buffer before (minutes)<input type="number" name="bufferBefore" min="0" max="120" step="15" value="0" required></label><label>Buffer after (minutes)<input type="number" name="bufferAfter" min="0" max="120" step="15" value="0" required></label></div>
<label>Daily limit (0 = unlimited)<input type="number" name="maxPerDay" min="0" max="100" value="0" required></label>
<label class="check"><input type="checkbox" name="googleMeet" checked>Google Meet</label>
<label class="check"><input type="checkbox" name="reminders" checked>Email reminders</label>
<label class="check"><input type="checkbox" name="enabled" checked>Accept bookings</label>
<p id="form-error" role="alert"></p><div class="form-actions"><button type="submit" id="save">Create page</button><button type="button" id="discard">Cancel</button></div>
</form></div></section><section class="panel mat-crt scr-green" id="p-console" data-w="300" style="--tilt:rotate(0.3deg)"><div class="titlebar"><span class="tl">Keyring</span><button class="pbtn" data-act="min" aria-label="Minimize Keyring">−</button><button class="pbtn" data-act="close" aria-label="Close Keyring">×</button></div><div class="pbody"><form id="unlock-keyring"><label>Keyring passphrase<input name="passphrase" type="password" autocomplete="off" required></label><button>Unlock</button></form><div id="keyring" hidden><p id="fingerprint"></p><button id="copy-address">Copy identity link</button><form id="partner-form"><label>Identity link<input id="partner-link" type="url" required></label><button>Request</button></form><div id="partner-result"></div><div id="partners"></div><label class="check"><input id="share-history" type="checkbox">Share older posts</label></div><p id="keyring-status" role="status"></p></div></section><section class="panel mat-paper" id="p-litany" data-w="300"><div class="titlebar"><span class="tl">Password</span><button class="pbtn" data-act="min" aria-label="Minimize Password">−</button><button class="pbtn" data-act="close" aria-label="Close Password">×</button></div><div class="pbody"><form id="password-form"><label>Current password<input name="current" type="password" autocomplete="current-password" required></label><label>New password<input name="next" type="password" autocomplete="new-password" minlength="16" required></label><label>Confirm password<input name="confirm" type="password" autocomplete="new-password" minlength="16" required></label><button>Save</button><p id="password-status" role="alert"></p></form></div></section></main><div id="dock" hidden aria-label="Closed panels"></div><noscript>JavaScript is required.</noscript></body></html>
