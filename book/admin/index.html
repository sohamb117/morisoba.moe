<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>Calendar admin ✠ morisoba</title><link rel="stylesheet" href="/shared/chrome.css"><link rel="stylesheet" href="/shared/typography.css"><link rel="stylesheet" href="/book/admin/style.css"><script defer src="/book/admin/app.js"></script></head><body><header><a href="https://morisoba.moe/">✠ morisoba.moe</a><span>CALENDAR / ADMIN</span><button id="logout">Sign out</button></header><main><div class="heading"><h1>Booking pages</h1><button id="new">+ New page</button></div><p id="connection" class="muted" role="status"></p><p id="status" role="status"></p><div class="layout"><section class="panel booted mat-paper"><div class="titlebar"><span class="tl">Pages</span><span id="count"></span></div><div id="list" class="pbody"></div></section><section id="editor" class="panel booted mat-crt" hidden><div class="titlebar"><span class="tl" id="editor-title">New page</span><button class="pbtn" id="close" aria-label="Close editor">×</button></div><div class="pbody"><form id="page-form">
<label>Title<input name="title" required maxlength="100" placeholder="30-minute meeting"></label>
<label>Booking name<input name="slug" required maxlength="64" pattern="[a-z0-9][a-z0-9_\-]{0,63}" placeholder="intro"></label><p class="url" id="url">calendar.morisoba.moe/intro</p>
<label>Description <span>(optional)</span><textarea name="description" maxlength="500" rows="2"></textarea></label>
<div class="pair"><label>Duration<select name="duration"><option value="15">15 minutes</option><option value="30" selected>30 minutes</option><option value="45">45 minutes</option><option value="60">1 hour</option><option value="90">90 minutes</option><option value="120">2 hours</option></select></label><label>Timezone<select name="timezone" id="zones"></select></label></div>
<label>Location <span>(optional)</span><input name="location" maxlength="200" placeholder="Address or meeting link"></label>
<fieldset><legend>Available days</legend><div class="weekdays"><label><input type="checkbox" name="day" value="1" checked>Mon</label><label><input type="checkbox" name="day" value="2" checked>Tue</label><label><input type="checkbox" name="day" value="3" checked>Wed</label><label><input type="checkbox" name="day" value="4" checked>Thu</label><label><input type="checkbox" name="day" value="5" checked>Fri</label><label><input type="checkbox" name="day" value="6">Sat</label><label><input type="checkbox" name="day" value="0">Sun</label></div></fieldset>
<div class="pair"><label>From<input type="time" name="start" value="13:00" step="900" required></label><label>Until<input type="time" name="end" value="17:00" step="900" required></label></div>
<div class="pair"><label>Minimum notice (hours)<input type="number" name="noticeHours" min="1" max="168" value="24" required></label><label>Booking window (days)<input type="number" name="horizonDays" min="1" max="90" value="30" required></label></div>
<label class="check"><input type="checkbox" name="enabled" checked>Accept bookings</label>
<p id="form-error" role="alert"></p><div class="form-actions"><button type="submit" id="save">Create page</button><button type="button" id="discard">Cancel</button></div>
</form></div></section></div></main><footer>✠ calendar.morisoba.moe</footer></body></html>
