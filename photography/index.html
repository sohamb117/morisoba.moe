<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#030303"><title>Photography · morisoba</title><link rel="stylesheet" href="../shared/chrome.css?v=cursor-off"><link rel="stylesheet" href="../shared/hud.css?v=3"><link rel="stylesheet" href="../shared/typography.css?v=2"><link rel="stylesheet" href="style.css"><script defer src="app.js"></script></head><body>
<a id="home-button" href="https://morisoba.moe">◄ ✠ HOME</a>
<div id="big-rings" aria-hidden="true"><svg viewBox="0 0 600 600" fill="none" stroke="#e8e8e8"><circle cx="300" cy="300" r="290"/><circle cx="300" cy="300" r="230" stroke-dasharray="3 8"/><circle cx="300" cy="300" r="170"/><path d="M300 10V590M10 300H590M95 95L505 505M505 95L95 505"/></svg></div>
<main id="workspace">
<div class="sidebar">
<section class="panel mat-paper" id="identity"><div class="titlebar"><span class="tl">identity</span></div><div class="pbody"><h1>PHOTOGRAPHY</h1><p id="total" aria-live="polite"></p></div></section>
<section class="panel mat-metal" id="query"><div class="titlebar"><span class="tl">query</span></div><div class="pbody"><div class="file-actions"><label class="file-button">Open photos<input id="files" type="file" accept="image/jpeg,image/png,image/webp" multiple></label><label class="file-button">Open folder<input id="folder" type="file" webkitdirectory multiple></label></div><p class="local-note">Photos stay on this device.</p><label for="search">Search photos</label><input id="search" type="search" placeholder="filename / collection"><button id="density" aria-label="Switch to compact grid">Compact grid</button></div></section>
<section class="panel mat-metal" id="collections"><div class="titlebar"><span class="tl">collections</span></div><nav class="pbody" id="albums" aria-label="Photo collections"></nav></section>
</div>
<section class="panel mat-metal" id="contact"><div class="titlebar"><span class="tl" id="collection">All photographs</span><span id="shown"></span></div><div class="pbody contact-body"><div id="grid" class="grid"></div><p id="empty" hidden>Open photos or a folder to begin.</p></div></section>
<section class="panel mat-frame" id="detail"><div class="titlebar"><span class="tl">photograph</span><button class="pbtn" id="expand" aria-label="Open full-size viewer">⛶</button></div><div class="pbody detail-body"><button id="preview-open" aria-label="Open selected photograph"><img id="preview-image" alt=""></button><div class="details"><h2 id="preview-title"></h2><p id="preview-album"></p><p id="preview-size"></p><div class="preview-controls"><button id="preview-prev" aria-label="Previous selected photograph">←</button><span id="preview-count"></span><button id="preview-next" aria-label="Next selected photograph">→</button></div></div></div></section>
</main>
<dialog id="viewer" aria-label="Photograph viewer"><div class="viewer-bar"><span id="position"></span><div><button id="zoom" aria-label="Zoom image">Zoom</button><button id="full">Fullscreen</button><button id="close" aria-label="Close viewer">Close ×</button></div></div><div id="image-stage"><button id="prev" aria-label="Previous photograph">←</button><div id="image-wrap"><img id="large" alt=""></div><button id="next" aria-label="Next photograph">→</button></div><div class="caption"><div><h2 id="photo-title"></h2><p id="photo-album"></p></div><span id="dimensions"></span></div><div id="filmstrip" aria-label="Nearby photographs"></div></dialog>
</body></html>
